<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Jev × Block Out! — live arena</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%237c9cff'/%3E%3C/svg%3E" />
<style>
  :root { --bg:#0f1117; --panel:#171a23; --panel2:#1c2030; --line:#2a2f3d; --text:#e6e8ee; --muted:#8b93a7; --accent:#7c9cff; --ok:#8ff0a4; --warn:#f5d76e; --err:#ff8a7a; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:13px/1.4 system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; }
  header { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:16px; margin:0 8px 0 0; white-space:nowrap; }
  header label { color:var(--muted); display:flex; gap:5px; align-items:center; }
  input, select, button { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:7px; padding:5px 8px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:#4a5268; }
  button.primary { background:var(--accent); color:#0b0d12; border:none; font-weight:600; }
  button:disabled { opacity:.45; cursor:default; }
  .spacer { flex:1; }
  #arena { flex:1; min-height:0; display:grid; grid-template-columns:repeat(var(--lanes, 2), minmax(0, 1fr)) var(--emu, 0px); }
  .lane { min-width:0; min-height:0; display:flex; flex-direction:column; border-right:1px solid var(--line); }
  .lane-head { display:flex; gap:8px; align-items:center; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); }
  .lane-head .tag { font-weight:700; color:var(--accent); font-size:15px; }
  .pill { padding:1px 8px; border-radius:99px; border:1px solid var(--line); font-size:12px; color:var(--muted); white-space:nowrap; }
  .pill.running { color:var(--warn); border-color:#5c5320; } .pill.won { color:var(--ok); border-color:#2f5c3a; } .pill.bad { color:var(--err); border-color:#5c2f2a; }
  .lane-top { display:grid; grid-template-columns:minmax(220px, 46%) 1fr; gap:10px; padding:10px 12px; }
  .boardwrap { position:relative; }
  canvas { width:100%; aspect-ratio:1; background:#0b0d12; border-radius:12px; display:block; }
  .banner { position:absolute; left:8px; right:8px; bottom:8px; text-align:center; font-weight:600; padding:5px; border-radius:8px; background:rgba(11,13,18,.85); display:none; }
  .stats { display:grid; grid-template-columns:repeat(3, 1fr); gap:5px; }
  .stats div { background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:4px 7px; }
  .stats b { display:block; font-size:16px; } .stats span { color:var(--muted); font-size:11px; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:10px 0 5px; display:flex; gap:6px; align-items:center; }
  .chosen { font-size:12px; min-height:17px; }
  .opt { display:grid; grid-template-columns:1fr 40px; gap:5px; align-items:center; margin:2px 0; font-size:11.5px; }
  .bar { position:relative; background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:2px 6px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .bar i { position:absolute; inset:0 auto 0 0; background:#2b3a6b; } .bar em { position:relative; font-style:normal; }
  .opt.pick .bar { border-color:var(--accent); } .opt.pick .bar i { background:#3d5bd1; }
  .route-confident { color:var(--ok); } .route-reask { color:var(--warn); } .route-solver-fallback, .route-low-confidence-accept { color:#ff9f7a; } .route-forced { color:var(--muted); }
  .feeds { flex:1; min-height:0; display:grid; grid-template-columns:3fr 2fr; border-top:1px solid var(--line); }
  .feed { min-height:0; overflow:auto; padding:6px 10px 10px; }
  .feed + .feed { border-left:1px solid var(--line); }
  .feed h2 { position:sticky; top:-6px; background:var(--bg); margin:0 -10px 6px; padding:6px 10px; z-index:1; }
  .call { border:1px solid var(--line); border-left:3px solid var(--line); border-radius:7px; background:var(--panel); padding:6px 8px; margin-bottom:6px; }
  .call.pending { border-left-color:var(--warn); } .call.ok { border-left-color:var(--ok); } .call.err { border-left-color:var(--err); }
  .call-head { display:flex; gap:6px; flex-wrap:wrap; align-items:baseline; font-size:12px; }
  .call-head .t { margin-left:auto; color:var(--muted); font-variant-numeric:tabular-nums; }
  .call-sum { font-size:12px; margin-top:3px; color:#c9cede; word-break:break-word; }
  .call-sum .e { color:var(--err); }
  details { margin-top:3px; } summary { cursor:pointer; color:var(--accent); font-size:11.5px; }
  pre { margin:4px 0 0; padding:6px 8px; background:#0b0d12; border:1px solid var(--line); border-radius:6px; max-height:320px; overflow:auto; font:11px/1.35 ui-monospace, Consolas, monospace; white-space:pre-wrap; word-break:break-word; color:#c9cede; }
  .moves { font:11.5px/1.5 ui-monospace, Consolas, monospace; color:var(--muted); }
  .moves div.last { color:var(--text); }
  .muted { color:var(--muted); font-size:12px; }
  #emu { display:none; min-height:0; flex-direction:column; background:var(--panel); }
  #emu.on { display:flex; }
  #emu img { width:100%; flex:1; min-height:0; object-fit:contain; background:#000; }
  #emu .muted { padding:8px 10px; }
  @media (max-width: 1100px) { #arena { grid-template-columns:1fr; overflow:auto; } .lane { min-height:900px; } }
</style>
</head>
<body>
<header>
  <h1>Jev × Block Out! <span class="muted">live arena</span></h1>
  <label>Level <input id="level" list="levels" value="demo" size="7" title="level number or 'demo'" /></label>
  <datalist id="levels"><option value="demo">demo board</option></datalist>
  <label>Move delay <input id="delay" type="number" value="700" min="0" step="100" style="width:72px" /> ms</label>
  <label>Max turns <input id="maxTurns" type="number" value="300" min="1" style="width:64px" /></label>
  <button class="primary" id="runAll">▶ Run all lanes</button>
  <button id="pause">Pause</button><button id="resume">Resume</button><button id="step">Step</button><button id="stop">Stop</button>
  <span class="spacer"></span>
  <label title="Mirror the Android emulator screen (needs a running emulator with adb)"><input id="emuToggle" type="checkbox" /> Emulator</label>
  <button id="addLane" title="Add another lane">+ lane</button>
</header>
<div id="arena">
  <section id="emu">
    <div class="lane-head"><span class="tag">📱</span> Emulator mirror <span id="emuStatus" class="pill">checking…</span></div>
    <img id="emuImg" alt="" />
    <div class="muted">Live <code>adb screencap</code>, refreshed about once a second. Tick <b>device</b> on a lane to play its moves on the emulator too.</div>
  </section>
</div>

<template id="laneTpl">
  <section class="lane">
    <div class="lane-head">
      <span class="tag"></span>
      <select class="decider"></select>
      <label class="muted" title="Also drag the moves on the Android emulator"><input type="checkbox" class="device" /> device</label>
      <span class="pill status">idle</span>
      <span class="spacer"></span>
      <button class="run">Run</button><button class="stopOne">Stop</button><button class="close" title="Remove lane">✕</button>
    </div>
    <div class="lane-top">
      <div class="boardwrap"><canvas width="640" height="640"></canvas><div class="banner"></div></div>
      <div>
        <div class="stats">
          <div><b class="s-turn">–</b><span>turn</span></div>
          <div><b class="s-left">–</b><span>blocks left</span></div>
          <div><b class="s-conf">–</b><span>confidence</span></div>
          <div><b class="s-calls">0</b><span>model calls</span></div>
          <div><b class="s-tok">–</b><span>tokens in / out</span></div>
          <div><b class="s-lat">–</b><span>avg latency</span></div>
          <div><b class="s-prog">–</b><span>progress 0–4</span></div>
          <div><b class="s-dead">–</b><span>P(dead end)</span></div>
          <div><b class="s-time">–</b><span>elapsed</span></div>
        </div>
        <h2>Decision <span class="pill route"></span></h2>
        <div class="chosen muted">Pick a level and press Run.</div>
        <div class="opts"></div>
      </div>
    </div>
    <div class="feeds">
      <div class="feed calls"><h2>Model calls <span class="muted">(newest first)</span></h2><div class="list"></div></div>
      <div class="feed"><h2>Moves</h2><div class="moves"></div></div>
    </div>
  </section>
</template>

<script>
const COLORS = { red:"#e74c3c", blue:"#3498db", yellow:"#f1c40f", green:"#2ecc71", purple:"#9b59b6", orange:"#e67e22",
  pink:"#ff7eb6", darkblue:"#2c3e94", turquoise:"#1abc9c", darkgreen:"#1e7d44", white:"#ecf0f1", black:"#2d2d2d" };
const DECIDERS = ["gemini", "jev", "solver", "mock"];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const pct = (v) => v == null ? "–" : (v * 100).toFixed(0) + "%";
const secs = (ms) => (ms / 1000).toFixed(1) + "s";
const kfmt = (n) => n >= 10000 ? (n / 1000).toFixed(0) + "k" : n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n);
const q = new URLSearchParams(location.search);
let info = { deciders: { mock: true, solver: true }, device: false };
const lanes = new Map();
const MAX_CARDS = 80;

// ---------- board drawing (engine state → canvas; mirrors the game without the game) ----------
function geom(cv, s) {
  const b = s.board, cols = b.maxX - b.minX + 1, rows = b.maxY - b.minY + 1;
  const cell = Math.floor(Math.min(cv.width / cols, cv.height / rows));
  const ox = (cv.width - cols * cell) / 2, oy = (cv.height - rows * cell) / 2;
  return { cell, px: (x) => ox + (x - b.minX) * cell, py: (y) => oy + (b.maxY - y) * cell };
}
function draw(cv, s, moving) {
  const cx = cv.getContext("2d");
  const rr = (x, y, w, h, r) => { cx.beginPath(); cx.roundRect(x, y, w, h, r); };
  cx.clearRect(0, 0, cv.width, cv.height);
  if (!s) return;
  const g = geom(cv, s), c = g.cell, pad = c * 0.06;
  for (const f of s.board.floor) { cx.fillStyle = "#1d2230"; rr(g.px(f.x) + 1, g.py(f.y) + 1, c - 2, c - 2, c * .12); cx.fill(); }
  for (const w of s.board.walls) { cx.fillStyle = "#3a4152"; rr(g.px(w.x) + 2, g.py(w.y) + 2, c - 4, c - 4, c * .1); cx.fill(); }
  for (const d of s.doors) for (const p of d.cells) {
    cx.fillStyle = COLORS[d.color] || "#888"; cx.globalAlpha = d.ice ? 0.35 : 1;
    rr(g.px(p.x) + c * .15, g.py(p.y) + c * .15, c * .7, c * .7, c * .2); cx.fill(); cx.globalAlpha = 1;
    if (d.ice) { cx.fillStyle = "#cfefff"; cx.font = `bold ${c * .38}px system-ui`; cx.textAlign = "center"; cx.textBaseline = "middle"; cx.fillText("❄" + d.ice, g.px(p.x) + c / 2, g.py(p.y) + c / 2); }
  }
  for (const b of s.blocks) {
    const mv = moving && moving.id === b.id;
    const off = mv ? moving.off : { x: 0, y: 0 };
    cx.globalAlpha = mv ? moving.alpha : 1;
    for (const p of b.cells) {
      const x = g.px(p.x + off.x), y = g.py(p.y + off.y);
      cx.fillStyle = COLORS[b.color] || "#888"; rr(x + pad, y + pad, c - 2 * pad, c - 2 * pad, c * .18); cx.fill();
      if (b.layers.length) { cx.strokeStyle = COLORS[b.layers[0]]; cx.lineWidth = c * .1; rr(x + c * .25, y + c * .25, c * .5, c * .5, c * .1); cx.stroke(); }
      if (b.ice) { cx.fillStyle = "rgba(200,235,255,.55)"; rr(x + pad, y + pad, c - 2 * pad, c - 2 * pad, c * .18); cx.fill(); }
    }
    const p0 = b.cells[0], x0 = g.px(p0.x + off.x) + c / 2, y0 = g.py(p0.y + off.y) + c / 2;
    cx.fillStyle = b.color === "white" || b.color === "yellow" ? "#222" : "#fff"; cx.font = `600 ${c * .26}px system-ui`; cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.fillText(b.ice ? "❄" + b.ice : b.axis === "horizontal" ? "↔" : b.axis === "vertical" ? "↕" : "", x0, y0);
    cx.globalAlpha = 1;
  }
}
function animateMove(cv, before, move, ms) {
  return new Promise((done) => {
    const pts = [{ x: 0, y: 0 }, ...move.path], segs = pts.length - 1;
    if (segs < 1 || ms < 30) return done();
    const t0 = performance.now();
    const tick = (t) => {
      const k = Math.max(0, Math.min(1, (t - t0) / ms)), f = k * segs, i = Math.min(segs - 1, Math.floor(f)), r = f - i;
      const a = pts[i], b = pts[i + 1];
      const tail = move.kind === "exit" ? Math.max(0, (f - (segs - 2)) / 2) : 0;
      draw(cv, before, { id: move.blockId, off: { x: a.x + (b.x - a.x) * r, y: a.y + (b.y - a.y) * r }, alpha: 1 - tail * .9 });
      k < 1 ? requestAnimationFrame(tick) : done();
    };
    requestAnimationFrame(tick);
  });
}

// ---------- model-call rendering ----------
function geminiAnswer(body) {
  const parts = body?.candidates?.[0]?.content?.parts || [];
  const text = parts.filter((p) => !p.thought && p.text).map((p) => p.text).join("");
  try { return text ? JSON.parse(text) : null; } catch { return text || null; }
}
function answerOf(c) {
  if (!c.body) return null;
  if (c.provider === "gemini") return geminiAnswer(c.body);
  if (c.provider === "jev") return c.body.answers ?? c.body;
  return c.body;
}
function usageOf(c) {
  const u = c.body?.usageMetadata, j = c.body?.usage;
  if (u) return `${u.promptTokenCount ?? "?"} in · ${u.candidatesTokenCount ?? 0}${u.thoughtsTokenCount ? " + " + u.thoughtsTokenCount + " thinking" : ""} out`;
  if (j) return `${j.input_tokens ?? "?"} in · ${j.output_tokens ?? "?"} out`;
  return "";
}
function requestText(c) {
  const p = c.payload;
  if (c.provider === "gemini") {
    const prompt = p?.contents?.[0]?.parts?.[0]?.text ?? "";
    const { contents, ...rest } = p || {};
    return `POST ${c.endpoint}\n\n── prompt ──\n${prompt}\n\n── generationConfig ──\n${JSON.stringify(rest.generationConfig, null, 2)}`;
  }
  if (c.provider === "jev") return `${c.endpoint}\n\n${JSON.stringify(p, null, 2)}`;
  return `(local, no network)\n\n${JSON.stringify(p, null, 2)}`;
}
function responseText(c) {
  if (c.error) return c.error;
  const a = answerOf(c);
  return `── answer ──\n${typeof a === "string" ? a : JSON.stringify(a, null, 2)}\n\n── raw body ──\n${JSON.stringify(c.body, null, 2)}`;
}
function summarize(L, c) {
  if (c.error) return `<span class="e">✗ ${esc(c.error)}</span>`;
  if (c.status && c.status >= 400) return `<span class="e">✗ HTTP ${c.status}: ${esc(c.body?.error?.message ?? "")}</span>`;
  const a = answerOf(c);
  if (!a || typeof a !== "object") return esc(String(a ?? ""));
  if (c.provider === "jev") {
    const m = a.next_move || {};
    return `→ <b>${esc(L.options[m.choice] || m.choice)}</b> · conf ${pct(m.confidence)} · progress ${a.progress?.score?.toFixed?.(2) ?? "–"} · dead-end ${pct(a.dead_end?.noul)}`;
  }
  const top = (a.top_moves || []).map((t) => `${esc(t.move)} ${pct(t.probability)}`).join(", ");
  return `→ <b>${esc(L.options[a.next_move] || a.next_move)}</b> · progress ${a.progress ?? "–"} · dead-end ${pct(a.dead_end)}<br><span class="muted">top: ${top}</span>`;
}
function addCall(L, e) {
  const list = L.el.querySelector(".calls .list");
  if (e.phase === "request") {
    const card = document.createElement("div");
    card.className = "call pending";
    card.dataset.t0 = Date.now();
    const opts = e.payload?.contents ? (e.payload.generationConfig?.responseJsonSchema?.properties?.next_move?.enum?.length)
      : Object.keys(e.payload?.questions?.next_move?.options ?? e.payload?.options ?? {}).length;
    card.innerHTML = `<div class="call-head"><b>#${e.callId}</b><span>turn ${e.n}</span><span class="pill">${esc(e.round || "")}</span>
      <span>${esc(e.provider)} · <code>${esc(e.model)}</code>${e.attempt > 1 ? ` · attempt ${e.attempt}` : ""}</span><span class="t">⏳ 0.0s</span></div>
      <div class="call-sum muted">waiting… ${opts ? opts + " legal options sent" : ""}</div>
      <details class="req"><summary>Request</summary></details><details class="res"><summary>Response</summary></details>`;
    card.querySelector(".req").addEventListener("toggle", function () { if (this.open && !this.querySelector("pre")) this.insertAdjacentHTML("beforeend", `<pre>${esc(requestText(e))}</pre>`); });
    L.cards.set(e.callId, { card, req: e });
    list.prepend(card);
    while (list.children.length > MAX_CARDS) { const last = list.lastElementChild; L.cards.forEach((v, k) => v.card === last && L.cards.delete(k)); last.remove(); }
  } else {
    const rec = L.cards.get(e.callId);
    if (!rec) return;
    const ok = !e.error && e.status && e.status < 400;
    rec.card.className = "call " + (ok ? "ok" : "err");
    rec.card.querySelector(".t").textContent = `${ok ? "✓" : "✗"} ${e.status || "net"} · ${secs(e.ms)}${usageOf(e) ? " · " + usageOf(e) : ""}`;
    rec.card.querySelector(".call-sum").className = "call-sum";
    rec.card.querySelector(".call-sum").innerHTML = summarize(L, e);
    rec.card.querySelector(".res").addEventListener("toggle", function () { if (this.open && !this.querySelector("pre")) this.insertAdjacentHTML("beforeend", `<pre>${esc(responseText(e))}</pre>`); });
    if (ok) { L.calls++; L.latSum += e.ms; }
    L.el.querySelector(".s-calls").textContent = L.calls;
    L.el.querySelector(".s-lat").textContent = L.calls ? secs(L.latSum / L.calls) : "–";
  }
}
setInterval(() => {
  for (const c of document.querySelectorAll(".call.pending .t")) c.textContent = "⏳ " + secs(Date.now() - +c.closest(".call").dataset.t0);
  for (const L of lanes.values()) if (L.t0 && L.running) L.el.querySelector(".s-time").textContent = secs(Date.now() - L.t0);
}, 200);

// ---------- lanes ----------
function setStatus(L, text, cls) { const p = L.el.querySelector(".status"); p.textContent = text; p.className = "pill status " + (cls || ""); }
function resetLane(L, e) {
  L.queue = []; L.cards.clear(); L.calls = 0; L.latSum = 0; L.tokIn = 0; L.tokOut = 0; L.options = {}; L.t0 = Date.now(); L.running = true;
  const el = L.el;
  el.querySelector(".calls .list").innerHTML = ""; el.querySelector(".moves").innerHTML = ""; el.querySelector(".opts").innerHTML = "";
  for (const k of ["turn", "conf", "prog", "dead", "lat", "tok"]) el.querySelector(".s-" + k).textContent = "–";
  el.querySelector(".s-calls").textContent = "0"; el.querySelector(".s-left").textContent = e.state.blocks.length;
  el.querySelector(".banner").style.display = "none"; el.querySelector(".route").textContent = "";
  el.querySelector(".chosen").textContent = `Level ${e.level} · ${e.decider} · ${e.mode} — thinking…`;
  if (!q.get(L.id) || L.started) el.querySelector(".decider").value = e.decider;
  L.started = true;
  setStatus(L, "running", "running");
  draw(L.cv, e.state);
}
function showTurn(L, e) {
  const el = L.el, d = e.decisions.at(-1);
  for (const x of e.decisions) { L.tokIn += x.tokens?.input || 0; L.tokOut += x.tokens?.output || 0; }
  el.querySelector(".s-turn").textContent = e.n; el.querySelector(".s-left").textContent = e.after.blocks.length;
  el.querySelector(".s-conf").textContent = d ? pct(d.confidence) : "forced";
  el.querySelector(".s-prog").textContent = d?.progress == null ? "–" : (+d.progress).toFixed(2);
  el.querySelector(".s-dead").textContent = pct(d?.deadEnd);
  el.querySelector(".s-tok").textContent = L.tokIn || L.tokOut ? `${kfmt(L.tokIn)} / ${kfmt(L.tokOut)}` : "–";
  const r = el.querySelector(".route"); r.textContent = e.route; r.className = "pill route route-" + e.route;
  el.querySelector(".chosen").textContent = "→ " + e.description; el.querySelector(".chosen").className = "chosen";
  const probs = d ? d.probabilities : { [e.moveId]: 1 };
  const top = Object.entries(probs).sort((a, b) => b[1] - a[1]).slice(0, 6);
  el.querySelector(".opts").innerHTML = top.map(([id, p]) => `<div class="opt ${id === e.moveId ? "pick" : ""}"><div class="bar" title="${esc(id)}"><i style="width:${(p * 100).toFixed(1)}%"></i><em>${esc(e.options[id] || id)}</em></div><span>${pct(p)}</span></div>`).join("")
    + `<div class="muted">${Object.keys(e.options).length} legal options offered</div>`;
  const mv = el.querySelector(".moves");
  mv.querySelector(".last")?.classList.remove("last");
  mv.insertAdjacentHTML("beforeend", `<div class="last">${String(e.n).padStart(3)}. <span class="route-${e.route}">[${e.route}${d ? " " + pct(d.confidence) : ""}]</span> ${esc(e.description)}</div>`);
  mv.parentElement.scrollTop = mv.parentElement.scrollHeight;
}
async function pump(L) {
  if (L.busy) return; L.busy = true;
  while (L.queue.length) {
    const e = L.queue.shift();
    if (e.type === "turn") {
      showTurn(L, e);
      await animateMove(L.cv, e.before, e.move, Math.min(600, +$("delay").value || 0));
      draw(L.cv, e.after);
    } else if (e.type === "end") {
      L.running = false; draw(L.cv, e.state);
      const won = e.status === "won", b = L.el.querySelector(".banner");
      b.style.display = "block";
      b.textContent = won ? `✅ Solved in ${e.turns} moves · ${secs(e.ms)} · ${L.calls} calls` : `⏹ ${e.status}${e.reason ? " — " + e.reason.split("\n")[0] : ""} (${e.turns} moves)`;
      L.el.querySelector(".s-time").textContent = secs(e.ms);
      setStatus(L, won ? `won · ${e.turns} moves` : e.status, won ? "won" : "bad");
    } else if (e.type === "error") {
      L.el.querySelector(".moves").insertAdjacentHTML("beforeend", `<div style="color:var(--err)">⚠ ${esc(e.message)}</div>`);
    }
  }
  L.busy = false;
}
function onEvent(e) {
  const L = lanes.get(e.lane) || makeLane(e.lane);
  if (e.type === "start") { resetLane(L, e); return; }
  if (e.type === "call") { if (e.phase === "request" && e.payload) Object.assign(L.options, e.payload.questions?.next_move?.options ?? e.payload.options ?? {}); if (e.phase === "request" && e.payload?.contents) Object.assign(L.options, parseGeminiOptions(e.payload)); addCall(L, e); return; }
  L.queue.push(e); pump(L);
}
function parseGeminiOptions(p) {
  const out = {}, text = p.contents?.[0]?.parts?.[0]?.text || "";
  const sec = text.split("Legal moves (id: description):\n")[1]?.split("\n\n")[0] || "";
  for (const line of sec.split("\n")) { const m = line.match(/^- (\S+): (.*)$/); if (m) out[m[1]] = m[2]; }
  return out;
}
function deciderOptions(sel, pick) {
  sel.innerHTML = DECIDERS.map((d) => `<option value="${d}" ${info.deciders[d] === false ? "disabled" : ""}>${d}${info.deciders[d] === false ? " (no key)" : ""}</option>`).join("");
  sel.value = pick;
}
function defaultDecider(i) {
  const ok = (d) => info.deciders[d] !== false;
  const prefs = i === 0 ? ["gemini", "jev", "mock"] : i === 1 ? ["jev", "solver"] : ["mock", "solver"];
  return prefs.find(ok) || "mock";
}
function makeLane(id) {
  const el = $("laneTpl").content.firstElementChild.cloneNode(true);
  const L = { id, el, cv: el.querySelector("canvas"), queue: [], cards: new Map(), options: {}, calls: 0, latSum: 0, tokIn: 0, tokOut: 0, busy: false, running: false };
  el.querySelector(".tag").textContent = id.toUpperCase();
  deciderOptions(el.querySelector(".decider"), q.get(id) || defaultDecider(lanes.size));
  el.querySelector(".run").onclick = () => runLane(L);
  el.querySelector(".stopOne").onclick = () => post("/stop", { lane: id });
  el.querySelector(".close").onclick = () => { post("/stop", { lane: id }); lanes.delete(id); el.remove(); layout(); };
  $("arena").insertBefore(el, $("emu"));
  lanes.set(id, L); layout();
  return L;
}
function layout() { $("arena").style.setProperty("--lanes", Math.max(1, lanes.size)); $("arena").style.setProperty("--emu", $("emuToggle").checked ? "minmax(260px, 22%)" : "0px"); }
function laneError(L, msg) { setStatus(L, "error", "bad"); L.el.querySelector(".chosen").textContent = "⚠ " + msg; L.el.querySelector(".chosen").className = "chosen"; }
async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body || {}) });
  return r.json();
}
async function runLane(L) {
  const j = await post("/run", { lane: L.id, level: $("level").value.trim() || "demo", decider: L.el.querySelector(".decider").value,
    delayMs: +$("delay").value, maxTurns: +$("maxTurns").value || undefined, device: L.el.querySelector(".device").checked });
  if (j.error) laneError(L, j.error);
}
$("runAll").onclick = () => { for (const L of lanes.values()) runLane(L); };
$("pause").onclick = () => post("/pause"); $("resume").onclick = () => post("/resume"); $("step").onclick = () => post("/step"); $("stop").onclick = () => post("/stop");
$("addLane").onclick = () => { const id = "abcdefgh".split("").find((c) => !lanes.has(c)); if (id) makeLane(id); };

// ---------- emulator mirror ----------
let emuBusy = false;
async function refreshEmu() {
  if (!$("emuToggle").checked || emuBusy) return;
  emuBusy = true;
  try {
    const r = await fetch("/screen?t=" + Date.now());
    if (r.ok) { const url = URL.createObjectURL(await r.blob()); const img = $("emuImg"); const old = img.src; img.src = url; if (old.startsWith("blob:")) URL.revokeObjectURL(old); $("emuStatus").textContent = "live"; $("emuStatus").className = "pill won"; }
    else { $("emuStatus").textContent = "no device"; $("emuStatus").className = "pill bad"; }
  } catch { $("emuStatus").textContent = "offline"; $("emuStatus").className = "pill bad"; }
  emuBusy = false;
}
setInterval(refreshEmu, 1000);
$("emuToggle").onchange = () => { $("emu").classList.toggle("on", $("emuToggle").checked); layout(); refreshEmu(); };

// ---------- boot ----------
(async () => {
  try { info = await (await fetch("/levels")).json(); } catch {}
  $("levels").innerHTML = `<option value="demo">demo board</option>` + (info.levels || []).map((m) => `<option value="${m.levelIndex}">${m.isSuperHard ? "super hard" : m.isHard ? "hard" : ""}</option>`).join("");
  if (q.get("level")) $("level").value = q.get("level");
  if (q.get("delay")) $("delay").value = q.get("delay");
  const n = Math.max(1, Math.min(8, +(q.get("lanes") || 2)));
  for (let i = 0; i < n; i++) if (!lanes.has("abcdefgh"[i])) makeLane("abcdefgh"[i]);
  if (info.device && q.get("emu") !== "0") { $("emuToggle").checked = true; $("emuToggle").onchange(); }
  const es = new EventSource("/events");
  es.onmessage = (m) => onEvent(JSON.parse(m.data));
  if (q.get("autorun")) setTimeout(() => $("runAll").click(), 300);
})();
</script>
</body>
